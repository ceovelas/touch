<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F2F2F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Touch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#F2F2F4;--card:#fff;--ink:#111113;--ink2:#6B6B70;--ink3:#A1A1A6;
  --line:rgba(17,17,19,.08);--fill:#EEEEF1;--fill2:#E4E4E8;
  --tg:#229ED9;--tgBg:#E7F5FC;--ig:#E1306C;--igBg:#FDECF3;--ok:#1E9A55;--okBg:#E6F6EC;
  --ease:cubic-bezier(.32,.72,0,1);--out:cubic-bezier(.16,1,.3,1);
  --sh:0 0 0 .5px rgba(17,17,19,.05),0 1px 2px rgba(17,17,19,.04),0 10px 28px rgba(17,17,19,.04);
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;margin:0;height:100%;background:#E9E9EC;color:var(--ink);font-family:Manrope,-apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
a{color:inherit;text-decoration:none}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg);contain:layout paint}
.screen{will-change:transform;position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;background:var(--bg);padding:calc(var(--st) + 18px) 20px calc(118px + var(--sb));backface-visibility:hidden}
.screen.pushed{z-index:30;box-shadow:-14px 0 40px rgba(17,17,19,.10);padding-bottom:calc(40px + var(--sb))}
.screen::-webkit-scrollbar{display:none}
.ic{display:block;flex:none}

/* motion */
@keyframes rise{from{opacity:0;transform:translate3d(0,16px,0)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes shimmer{from{background-position:-200px 0}to{background-position:200px 0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ripple{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.anim>*{animation:rise .6s var(--out) both;animation-delay:calc(var(--si,0)*42ms)}
.p{transition:transform .2s var(--ease),opacity .2s,background-color .25s,color .25s}
.p:active{transform:scale(.955);opacity:.86}

/* type */
.title{margin:4px 0 2px;font-weight:700;font-size:34px;line-height:1.08;letter-spacing:-1px}
.sub{font-size:14px;font-weight:500;color:var(--ink2)}
.h2{margin:26px 0 12px;font-weight:700;font-size:22px;letter-spacing:-.5px}
.cap{font-size:13px;font-weight:600;color:var(--ink2)}
.big{font-weight:600;font-size:46px;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.note{display:flex;gap:10px;align-items:flex-start;margin:18px 4px 0;font-size:13px;font-weight:500;line-height:1.45;color:var(--ink2)}
.note .ic{margin-top:1px}
.hint{margin:10px 6px 18px;font-size:13px;font-weight:500;line-height:1.45;color:var(--ink2)}

/* layout bits */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;min-height:48px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.nm{font-weight:700;font-size:21px;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowb{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.between{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--sh)}
.roundbtn{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;flex:none}
.roundbtn.dark{background:var(--ink);color:#fff;box-shadow:none}
.pillw{background:#fff;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;box-shadow:var(--sh);white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:58px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;letter-spacing:-.1px}
.btn:disabled{background:#C9C9CE;color:#fff;pointer-events:none}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.btn.danger{background:#fff;color:#D92D20;box-shadow:var(--sh)}

/* avatar */
.av{--s:48px;width:var(--s);height:var(--s);border-radius:50%;position:relative;overflow:hidden;flex:none;display:grid;place-items:center;font-weight:700;font-size:calc(var(--s)*.34);letter-spacing:-.3px}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fade .4s both}
.avstack{display:flex}.avstack .av{box-shadow:0 0 0 2.5px #fff}.avstack .av+.av,.avstack .more{margin-left:-10px}
.more{width:32px;height:32px;border-radius:50%;background:var(--fill);box-shadow:0 0 0 2.5px #fff;display:grid;place-items:center;font-size:11.5px;font-weight:700}

/* hero add */
.hero{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--ink);color:#fff;border-radius:26px;padding:16px 16px 16px 18px}
.hero .pl{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;flex:none}
.hero .tx{flex:1;display:flex;flex-direction:column;gap:3px}.hero b{font-size:17px;font-weight:700;letter-spacing:-.2px}.hero span{font-size:13px;font-weight:500;color:#A9A9AF}
.hero .go{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}

/* grid cards */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:16px;height:196px;display:flex;flex-direction:column;text-align:left}
.tile .t1{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:15px}
.gauge{position:relative;margin-top:14px;height:86px}
.gauge svg{display:block;width:100%;height:86px}
.gauge .gfg{transition:stroke-dashoffset 1.2s var(--out)}
.gauge .gn{position:absolute;left:0;right:0;bottom:0;text-align:center;font-weight:600;font-size:36px;line-height:1;letter-spacing:-1.4px}
.tile .gs{margin-top:10px;text-align:center;font-size:13px;font-weight:500;color:var(--ink2)}
.tile .n{margin-top:10px;font-weight:600;font-size:54px;line-height:1;letter-spacing:-2.4px}
.tile .nl{margin-top:5px;font-size:13px;font-weight:500;color:var(--ink2)}
.tile .fill{flex:1}

.wide{display:flex;align-items:center;gap:16px;padding:18px 18px 18px 20px;width:100%;text-align:left}
.wide .l{flex:1;min-width:0}
.mini{display:flex;align-items:flex-end;gap:5px;height:70px;width:120px;flex:none}
.mini i{flex:1;border-radius:6px;background:#DADADF;transform-origin:bottom;animation:grow .8s var(--out) both;animation-delay:calc(var(--i)*55ms + .2s)}
.mini i.on{background:var(--ink)}
.delta{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;background:var(--okBg);color:var(--ok)}
.delta.neg{background:#FDEBEA;color:#D92D20}.delta.zero{background:var(--fill);color:var(--ink2)}

/* segmented */
.seg{--n:2;--i:0;position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(118,118,128,.12);border-radius:999px;padding:3px;margin:14px 0}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 3px 8px rgba(0,0,0,.05);transform:translate3d(calc(var(--i)*100%),0,0);transition:transform .5s var(--ease)}
.seg button{position:relative;height:40px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink2);transition:color .3s}
.seg button.on{color:var(--ink)}
.prog{height:6px;border-radius:99px;background:var(--fill2);overflow:hidden;margin:14px 0 0}
.prog i{display:block;height:100%;width:100%;background:var(--ink);border-radius:99px;transform-origin:left;transition:transform .8s var(--out)}

/* lists and rows */
.list{display:flex;flex-direction:column}
.lrow{content-visibility:auto;contain-intrinsic-size:auto 88px;display:flex;align-items:center;gap:12px;background:#fff;border-radius:24px;box-shadow:var(--sh);padding:13px 14px;margin-bottom:10px;width:100%;text-align:left;transition:transform .2s var(--ease)}
button.lrow:active,a.lrow:active{transform:scale(.985)}
.lmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.lname{font-weight:700;font-size:16px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chs{display:flex;flex-wrap:wrap;gap:6px}
.ch{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 8px;border-radius:999px;font-size:12.5px;font-weight:600;max-width:100%;white-space:nowrap}
.ch span{overflow:hidden;text-overflow:ellipsis}
.ch.tg{background:var(--tgBg);color:#1A87BA}.ch.ig{background:var(--igBg);color:#C42A5F}
.sendbtn{height:42px;padding:0 17px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;flex:none}
.check{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.check.soft{background:var(--fill);color:var(--ink2)}
.spill{font-size:12px;font-weight:700;border-radius:999px;padding:7px 11px;flex:none;background:var(--fill);color:var(--ink2);white-space:nowrap}
.spill.replied{background:var(--ink);color:#fff}
.spill.dialog{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.spill.call{background:#4A4A50;color:#fff}
.spill.client{background:var(--okBg);color:var(--ok)}
.spill.lost{background:var(--fill);color:var(--ink3)}
.quick{height:36px;padding:0 13px;border-radius:999px;background:var(--fill);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;flex:none}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:44px 20px;gap:12px;color:var(--ink2);font-weight:600;font-size:15px}
.empty .big2{width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:var(--sh);display:grid;place-items:center}
.empty svg path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .7s .15s var(--out) forwards}
.empty b{color:var(--ink);font-size:18px;letter-spacing:-.3px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -20px 14px;padding:2px 20px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{height:40px;padding:0 16px;border-radius:999px;background:#fff;box-shadow:var(--sh);font-weight:700;font-size:14px;white-space:nowrap;flex:none;display:flex;align-items:center;gap:7px;transition:background-color .3s,color .3s}
.chip i{font-style:normal;font-size:12px;opacity:.6}
.chip.on{background:var(--ink);color:#fff}

/* form */
.group{overflow:hidden}
.field{display:flex;align-items:center;gap:14px;padding:0 18px;height:66px}
.field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font-weight:600;font-size:17px;letter-spacing:-.2px}
.field input::placeholder{color:var(--ink3);font-weight:500}
.fic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.fic.tg{background:var(--tgBg);color:var(--tg)}.fic.ig{background:var(--igBg);color:var(--ig)}
.hair{height:.5px;background:var(--line);margin-left:70px}
.pv{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-top:12px;animation:rise .5s var(--out) both}
.pv .t{flex:1;min-width:0}.pv b{display:block;font-size:16px;letter-spacing:-.2px}.pv span{font-size:13px;color:var(--ink2);font-weight:500}
.sk{border-radius:12px;background:linear-gradient(90deg,#EEE 0,#F7F7F8 100px,#EEE 200px);background-size:400px 100%;animation:shimmer 1.2s linear infinite}
.found{width:28px;height:28px;border-radius:50%;background:var(--okBg);color:var(--ok);display:grid;place-items:center;animation:pop .45s var(--out) both}

/* stats */
.chart{position:relative;display:flex;align-items:flex-end;gap:var(--g,6px);height:150px;margin-top:20px}
.bar{flex:1;height:100%;position:relative;display:flex;align-items:flex-end}
.bar .b1{display:block;width:100%;height:calc(var(--h)*1%);min-height:4px;border-radius:7px;background:#DCDCE1;transform-origin:bottom;animation:grow .8s var(--out) both;animation-delay:calc(var(--i)*22ms);transition:background-color .3s}
.bar .b2{position:absolute;left:0;right:0;bottom:0;height:calc(var(--h2)*1%);min-height:0;border-radius:7px;background:var(--ink);transform-origin:bottom;animation:grow .8s var(--out) both;animation-delay:calc(var(--i)*22ms + 120ms)}
.bar.sel .b1{background:#B4B4BB}.bar.solo.sel .b1{background:var(--ink)}
.plan{position:absolute;left:0;right:0;border-top:1.5px dashed #C8C8CE;pointer-events:none}
.plan span{position:absolute;right:0;top:-22px;font-size:11px;font-weight:700;color:var(--ink2)}
.axis{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;font-weight:600;color:var(--ink2)}
.tip{margin-top:14px;font-size:13px;font-weight:600;color:var(--ink2);min-height:18px}.tip b{color:var(--ink)}
.legend{display:flex;gap:14px;margin-top:14px;font-size:12px;font-weight:600;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.fun{padding:20px;margin-top:12px}
.fr{margin-top:16px}.fr:first-of-type{margin-top:18px}
.fr .h{display:flex;align-items:baseline;justify-content:space-between;font-weight:600;font-size:14px;color:var(--ink2)}
.fr .h b{color:var(--ink);font-size:22px;font-weight:700;letter-spacing:-.6px;margin-left:8px;font-variant-numeric:tabular-nums}
.fr .tr{height:12px;border-radius:7px;background:var(--fill);margin-top:8px;overflow:hidden}
.fr .tr i{display:block;height:100%;border-radius:7px;transform-origin:left;animation:growx 1s var(--out) both;animation-delay:calc(var(--i)*90ms + .1s)}
.pc{font-size:12px;font-weight:700;background:var(--fill);border-radius:999px;padding:4px 9px;color:var(--ink)}
.sumline{display:flex;justify-content:space-between;align-items:center;background:var(--fill);border-radius:16px;padding:14px 16px;margin-top:20px;font-size:14px;font-weight:600;color:#3A3A3F}.sumline b{font-size:17px;color:var(--ink)}
.chcard{padding:16px;display:flex;flex-direction:column;gap:6px}
.chcard.tg{background:linear-gradient(180deg,#F1FAFE,#fff 70%)}.chcard.ig{background:linear-gradient(180deg,#FEF3F7,#fff 70%)}
.chcard .hd{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.chcard .pl{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff}
.chcard.tg .pl{background:var(--tg)}.chcard.ig .pl{background:linear-gradient(45deg,#F9A03F,#E1306C 55%,#833AB4)}
.chcard .v{font-weight:600;font-size:40px;letter-spacing:-1.6px;line-height:1.1;margin-top:8px}
.chcard .s{font-size:13px;font-weight:500;color:var(--ink2)}
.chcard .tr{height:6px;border-radius:4px;background:rgba(17,17,19,.07);margin-top:6px;overflow:hidden}
.chcard .tr i{display:block;height:100%;border-radius:4px;transform-origin:left;animation:growx 1s .25s var(--out) both}
.chcard.tg .tr i{background:var(--tg)}.chcard.ig .tr i{background:linear-gradient(90deg,#F9A03F,#E1306C,#833AB4)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tl{padding:14px 12px}.tl b{display:block;font-size:26px;font-weight:700;letter-spacing:-1px;margin-top:6px}.tl span{font-size:12px;font-weight:600;color:var(--ink2);line-height:1.3;display:block}

/* lead card */
.lhead{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 18px 18px;text-align:center}
.lhead .av{box-shadow:0 0 0 4px #fff,0 10px 26px rgba(17,17,19,.12)}
.lhead h1{margin:12px 0 0;font-size:27px;font-weight:700;letter-spacing:-.8px}
.lhead .hn{font-size:14px;font-weight:500;color:var(--ink2)}
.cbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:14px}
.cbtn{height:54px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;color:#fff}
.cbtn.tg{background:var(--tg)}.cbtn.ig{background:linear-gradient(45deg,#F9A03F,#E1306C 55%,#833AB4)}
.cbtn.add{background:#fff;color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--fill2)}
.cbtns.one{grid-template-columns:1fr}
.fchip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;background:var(--fill);font-weight:700;font-size:13px;margin-top:6px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sb{height:76px;border-radius:20px;background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:13px;transition:background-color .3s,color .3s,transform .2s var(--ease)}
.sb.on{background:var(--ink);color:#fff}.sb.on.client{background:var(--ok)}
.sb:active{transform:scale(.95)}
.steps{display:flex;gap:4px;margin:14px 0}.steps i{flex:1;height:5px;border-radius:3px;background:var(--fill2);transition:background-color .4s}.steps i.on{background:var(--ink)}
.notebox{padding:16px 18px}.notebox textarea{width:100%;min-height:76px;border:0;outline:0;resize:none;background:none;font-weight:500;font-size:15px;line-height:1.5}
.sec{padding:18px;margin-top:12px}

/* settings */
.stepper{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.stepper .n{font-weight:600;font-size:68px;letter-spacing:-3.4px;line-height:1;font-variant-numeric:tabular-nums}
.sbtn{width:58px;height:58px;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.sbtn.dark{background:var(--ink);color:#fff}
.irow{display:flex;align-items:center;gap:12px;padding:15px 18px;font-size:15px;font-weight:500}
.irow b{font-weight:700}.irow .r{margin-left:auto;font-weight:700;letter-spacing:2px;display:flex;align-items:center;gap:10px}
.irow+.irow{border-top:.5px solid var(--line)}

/* tabbar */
.tabbar{position:absolute;left:50%;bottom:calc(14px + var(--sb));transform:translateX(-50%);display:flex;padding:5px;border-radius:32px;background:rgba(255,255,255,.8);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);box-shadow:0 0 0 .5px rgba(17,17,19,.07),0 12px 32px rgba(17,17,19,.10);z-index:20;transition:transform .5s var(--ease),opacity .3s}
.tabbar.hide{transform:translate(-50%,120px);opacity:0}
.tabbar .thumb{position:absolute;top:5px;bottom:5px;left:5px;width:var(--tw,88px);border-radius:27px;background:var(--fill);transform:translate3d(calc(var(--i,0)*var(--tw,88px)),0,0);transition:transform .55s var(--ease)}
.tab{position:relative;width:var(--tw,88px);height:56px;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:10.5px;color:var(--ink2);transition:color .3s}
.tab.on{color:var(--ink)}
.tab .ic{transition:transform .45s var(--ease)}.tab.on .ic{transform:translateY(-1px) scale(1.06)}

/* setup */
.setup{display:flex;flex-direction:column;min-height:100%}
.rcards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.rcard{padding:18px;min-height:176px;display:flex;flex-direction:column;gap:8px;text-align:left;background:#fff;box-shadow:var(--sh);border-radius:26px;transition:background-color .3s,color .3s,transform .2s var(--ease)}
.rcard b{font-size:19px;letter-spacing:-.3px}.rcard span{font-size:13px;font-weight:500;opacity:.7;line-height:1.4}
.rcard.on{background:var(--ink);color:#fff}
.codebox{display:flex;gap:8px;margin-top:16px}

/* ============ stats (shared by demo and remote) ============ */
function computeStats(rows,period,tz,tempo){
  const today=todayIn(tz);let from,days=null,pf,pt;
  if(period==='all'){from=rows.reduce((m,r)=>r[0]<m?r[0]:m,today)}
  else{days=period;from=addDays(today,-(days-1));pf=addDays(from,-days);pt=addDays(from,-1)}
  const z=()=>({sent:0,replied:0,dialog:0,call:0,client:0});
  const add=(o,r)=>{o.sent++;if(r>=1)o.replied++;if(r>=2)o.dialog++;if(r>=3)o.call++;if(r>=4)o.client++};
  const cur=z(),prev=z(),ch={tg:{sent:0,replied:0},ig:{sent:0,replied:0}},per={};
  for(const r of rows){const d=r[0];
    if(d>=from&&d<=today){add(cur,r[2]);const o=ch[r[1]]||ch.tg;o.sent++;if(r[2]>=1)o.replied++;const p=per[d]||(per[d]={sent:0,replied:0});p.sent++;if(r[2]>=1)p.replied++}
    else if(days&&d>=pf&&d<=pt)add(prev,r[2]);}
  const span=Math.round((Date.parse(today)-Date.parse(from))/864e5)+1;
  const series=[];
  if(period!=='all'||span<=31){for(let i=0;i<span;i++){const d=addDays(from,i),o=per[d]||{sent:0,replied:0};series.push({label:dwd(d),sub:dwd(d)+', '+dlong(d),sent:o.sent,replied:o.replied,daily:true})}}
  else{const weeks=Math.min(16,Math.ceil(span/7));for(let w=weeks-1;w>=0;w--){const e=addDays(today,-w*7),s=addDays(e,-6);let a=0,b=0;for(let i=0;i<7;i++){const o=per[addDays(s,i)];if(o){a+=o.sent;b+=o.replied}}series.push({label:dlong(s),sub:'с '+dlong(s)+' по '+dlong(e),sent:a,replied:b,daily:false})}}
  const dv=Object.values(per);
  const best=series.reduce((m,s)=>s.daily&&s.sent>m.sent?s:m,{sent:0,sub:''});
  return {cur,prev:days?prev:null,delta:days&&prev.sent>0?Math.round((cur.sent-prev.sent)/prev.sent*100):null,series,ch,
    avg:Math.round(cur.sent/Math.max(1,days||span)*10)/10,best,planDays:dv.filter(o=>o.sent>=tempo).length,today};
}

  const R=rng(7),day=864e5,now=Date.now(),leads=[];let n=0;
  const mk=(o)=>{const b=NAMES[n%NAMES.length];const k=Math.floor(n/NAMES.length);const l=Object.assign({id:'d'+(++n),by:'s1',tg:null,ig:null,name:b[0],avatar:null,followers:null,note:'',status:'new',reached:0,channel:null,created_at:now-(2000-n)*6e4,sent_at:null,status_at:null},o);const h=b[1]+(k?k:'');const ch=R()<.62?'tg':'ig';if(R()<.7)l.tg=h;if(!l.tg||R()<.5)l.ig=h+(R()<.5?'.fit':'');if(!l.channel&&l.sent_at)l.channel=l.tg&&l.ig?ch:l.tg?'tg':'ig';if(l.sent_at&&l.channel==='tg'&&!l.tg){l.tg=h}if(l.sent_at&&l.channel==='ig'&&!l.ig){l.ig=h}l.followers=l.followers||Math.round(2000+R()*18000);return l};
  for(let d=29;d>=0;d--){const cnt=d===0?14:Math.round(15+R()*7)+(d<10?Math.floor((10-d)/3):0);
    for(let i=0;i<cnt;i++){const t=now-d*day-(i*17+3)*6e4;const l=mk({sent_at:t,status:'sent'});const p=R();
      if(p<.21+(d<15?.04:0)){const q=R();l.reached=q<.55?1:q<.8?2:q<.93?3:4;l.status=['','replied','dialog','call','client'][l.reached];if(R()<.14){l.status='lost'}l.status_at=t+3600e3}
      leads.push(l)}}
  for(let i=0;i<53;i++)leads.push(mk({}));
  for(let d=3;d>=0;d--){const cnt=d===0?4:9;for(let i=0;i<cnt;i++){const t=now-d*day-(i*23+5)*6e4;const l=mk({by:'s2',sent_at:t,status:'sent'});if(R()<.12){l.reached=1;l.status='replied';l.status_at=t+3600e3}leads.push(l)}}
  for(let i=0;i<2;i++)leads.push(mk({by:'s2',created_at:now-(20-i*3)*6e4}));
  const members=[{id:'o1',name:'Артем',role:'owner',photo:null,tempo:20},{id:'s1',name:'Андрей',role:'setter',photo:null,tempo:20},{id:'s2',name:'Артем 2',role:'setter',photo:null,tempo:15}];
  return {role:role||'owner',code:'K7M2QX',tz:'Asia/Tbilisi',leads,members,v:2};
}

const app=$('#app'),host=$('#host'),tabbar=$('#tabbar');
const EASE='cubic-bezier(.32,.72,0,1)';

function countUp(n,first){const v=+n.dataset.count||0;if(!first||v===0){n.textContent=v;return}const t0=performance.now(),dur=1000;(function f(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,4);n.textContent=Math.round(v*e);if(k<1)requestAnimationFrame(f)})(t0)}
function enhance(root,first){$$('[data-count]',root).forEach(n=>countUp(n,first))}
function mount(el,name,params,first){

  el.classList.toggle('anim',!!first);el.classList.toggle('still',!first);

  enhance(el,first);M[name]&&M[name](el,params||{},first);
}
function topEl(){return pushed.length?pushed[pushed.length-1].el:curEl}
function setBack(){try{if(!TG||!TG.BackButton)return;pushed.length?TG.BackButton.show():TG.BackButton.hide()}catch(e){}}

async function go(name,instant){
  if(pushed.length)await popAll();
  if(curTab===name&&curEl){curEl.scrollTo({top:0,behavior:'smooth'});return}
  const el=document.createElement('div');el.className='screen';mount(el,name,{},true);
  const old=curEl;curEl=el;curTab=name;host.appendChild(el);markTab(name);
  if(old&&!instant){el.animate([{opacity:0,transform:'translate3d(0,14px,0)'},{opacity:1,transform:'none'}],{duration:280,easing:EASE});old.animate([{opacity:1},{opacity:0}],{duration:90,fill:'forwards'}).finished.then(()=>old.remove())}
  else if(old)old.remove();
  hsel();setTimeout(()=>silentRefresh(),700);
}
async function push(name,params){
  const el=document.createElement('div');el.className='screen pushed';mount(el,name,params,true);app.appendChild(el);
  const under=topEl();const e={el,name,params,under};pushed.push(e);
  el.animate([{transform:'translate3d(100%,0,0)'},{transform:'none'}],{duration:480,easing:EASE});
  e.ua=under.animate([{transform:'none',filter:'brightness(1)'},{transform:'translate3d(-24%,0,0)',filter:'brightness(.93)'}],{duration:480,easing:EASE,fill:'both'});
  tabbar.classList.add('hide');setBack();hsel();
}
async function pop(){
  const e=pushed.pop();if(!e)return;setBack();if(!pushed.length)tabbar.classList.remove('hide');
  e.ua.playbackRate=-1;e.ua.play();
  const a=e.el.animate([{transform:'none'},{transform:'translate3d(100%,0,0)'}],{duration:420,easing:EASE,fill:'forwards'});
  await a.finished;e.el.remove();e.ua.cancel();
  if(e.name==='lead'||e.name==='settings'||e.name==='stats')silentRefresh(true);
}

  app.addEventListener('touchstart',ev=>{if(!pushed.length||ev.touches.length>1)return;const t=ev.touches[0];if(t.clientX-left()>24)return;s={x:t.clientX,y:t.clientY,t:performance.now(),lock:false,dx:0,e:pushed[pushed.length-1]}},{passive:true});
  app.addEventListener('touchmove',ev=>{if(!s)return;const t=ev.touches[0],dx=t.clientX-s.x,dy=t.clientY-s.y;
    if(!s.lock){if(Math.abs(dy)>Math.abs(dx)*1.2&&Math.abs(dy)>8){s=null;return}if(dx>8){s.lock=true;s.e.ua.pause()}else return}
    ev.preventDefault();s.dx=Math.max(0,dx);const w=app.clientWidth;s.e.el.style.transform=`translate3d(${s.dx}px,0,0)`;s.e.ua.currentTime=(1-Math.min(1,s.dx/w))*480},{passive:false});
  app.addEventListener('touchend',async()=>{if(!s||!s.lock){s=null;return}const w=app.clientWidth,v=s.dx/Math.max(1,performance.now()-s.t),done=s.dx>w*.34||v>.55,e=s.e;s=null;
    if(done){pushed.pop();setBack();if(!pushed.length)tabbar.classList.remove('hide');e.ua.playbackRate=-1;e.ua.play();const a=e.el.animate([{transform:e.el.style.transform},{transform:'translate3d(100%,0,0)'}],{duration:300,easing:EASE,fill:'forwards'});e.el.style.transform='';await a.finished;e.el.remove();e.ua.cancel()}
    else{const a=e.el.animate([{transform:e.el.style.transform},{transform:'none'}],{duration:300,easing:EASE});e.el.style.transform='';e.ua.playbackRate=1;e.ua.play();await a.finished}});
})();

/* ============ toast / sheet ============ */
let toastT=0;
function toast(msg,label,fn){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${label?`<button id="tact">${esc(label)}</button>`:''}`;t.classList.add('on');if(label)$('#tact').onclick=()=>{t.classList.remove('on');fn&&fn()};clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),label?4500:2200)}
function sheet(html,onMount){const bg=document.createElement('div'),sh=document.createElement('div');bg.className='sbg';sh.className='sheet';sh.innerHTML='<div class="grab"></div>'+html;app.append(bg,sh);
  const close=()=>{bg.classList.remove('on');sh.classList.remove('on');setTimeout(()=>{bg.remove();sh.remove()},500)};bg.onclick=close;requestAnimationFrame(()=>{bg.classList.add('on');sh.classList.add('on')});onMount&&onMount(sh,close);return close}

/* ============ data ============ */
const sigs={};const same=(k,v)=>{const s=JSON.stringify(v);if(sigs[k]===s)return true;sigs[k]=s;return false};
async function loadAll(){
  D.me=await api.me();
  if(D.me.role==='setter'){const[q,r]=await Promise.all([api.queue(),api.statRows()]);D.queue=q;D.rows=r;D.me.tempo=q.tempo}
  else{const[l,r,t]=await Promise.all([api.leads(),api.statRows(),api.team()]);D.leads=l;D.rows=r;D.team=t;D.queue=null}
  same('q',D.queue);same('l',D.leads);same('r',D.rows);same('t',D.team);
}
async function silentRefresh(force){
  if(!D.me||document.hidden||busy.size)return;
  const ae=document.activeElement;if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))return;
  const top=topEl();if(!top||document.querySelector('.sheet'))return;const n=top.dataset.name;
  try{
    let ch=false;
    const get=async(k,fn,set)=>{const v=await fn();if(!same(k,v)){set(v);ch=true}};
    const rows=()=>get('r',api.statRows,v=>{D.rows=v;D.rowsV=(D.rowsV||0)+1});
    if(D.me.role==='setter'){await get('q',api.queue,v=>{D.queue=v;D.me.tempo=v.tempo});await rows()}
    else if(n==='team'||n==='settings'){await get('t',api.team,v=>{D.team=v;v.forEach(t=>{const m=D.me.members.find(x=>x.id===t.id);if(m){m.tempo=t.tempo;m.name=t.name}})})}
    else if(n==='leads'||n==='lead'){await get('l',api.leads,v=>{D.leads=v})}
    else if(n==='stats'){await rows()}
    if(!ch&&!force)return;
    if(n==='add'||n==='lead'||n==='settings')return;
    const sc=top.scrollTop;
    if(n==='queue'){refreshQueueUI()}else if(n==='leads'){refreshLeadsUI()}else{mount(top,n,top===curEl?{}:pushed[pushed.length-1].params,false);top.scrollTop=sc}
  }catch(e){}
}
setInterval(silentRefresh,8000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)silentRefresh(true)});

/* ============ actions ============ */
function collapse(row){const h=row.offsetHeight;row.style.overflow='hidden';return row.animate([{height:h+'px',opacity:1,transform:'none',marginBottom:'10px'},{height:'0px',opacity:0,transform:'translate3d(48px,0,0) scale(.96)',marginBottom:'0px',paddingTop:'0px',paddingBottom:'0px'}],{duration:280,easing:EASE,fill:'forwards'}).finished}
function openCh(ch,u){const url=(ch==='tg'?'https://t.me/':'https://instagram.com/')+u;try{if(TG){ch==='tg'&&TG.openTelegramLink?TG.openTelegramLink(url):TG.openLink(url)}else window.open(url,'_blank','noopener')}catch(e){window.open(url,'_blank')}}
async function doSent(id){
  const q=D.queue,i=q.todo.findIndex(l=>l.id===id);if(i<0||busy.has(id))return;busy.add(id);hap('medium');
  const l=q.todo[i],ch=D.opened[id]||(l.tg?'tg':'ig'),row=$(`#qlist [data-lead="${id}"]`);
  const req=api.setSent(id,true,ch);
  if(row)await collapse(row);
  q.todo.splice(i,1);l.status='sent';l.sent_at=Date.now();l.channel=ch;q.done.unshift(l);q.sentToday++;q.backlog--;refreshQueueUI();hnote('success');
  toast('Отписано','Отменить',()=>doUnsent(id));
  try{await req;same('q',q);D.rows=(D.rows||[]).concat([[todayIn(tzOf()),ch,0]]);D.rowsV=(D.rowsV||0)+1}
  catch(e){const k=q.done.findIndex(x=>x.id===id);if(k>=0)q.done.splice(k,1);q.todo.splice(i,0,l);l.status='new';l.sent_at=null;q.sentToday--;q.backlog++;refreshQueueUI();toast('Нет связи, не сохранилось')}
  busy.delete(id);
}
async function doUnsent(id){
  const q=D.queue,l=q.done.find(x=>x.id===id);if(!l||l.status!=='sent')return;hap('light');
  q.done=q.done.filter(x=>x.id!==id);l.status='new';l.sent_at=null;q.todo.push(l);q.todo.sort((a,b)=>a.created_at-b.created_at);q.sentToday--;q.backlog++;
  if($('.screen[data-name="queue"]'))refreshQueueUI();
  try{await api.setSent(id,false,null);api.statRows().then(r=>{D.rows=r;D.rowsV=(D.rowsV||0)+1}).catch(()=>{})}catch(e){toast('Нет связи')}
}
async function setLeadStatus(id,s,fromList){
  const l=getLead(id);if(!l||l.status===s)return;const prev={status:l.status,reached:l.reached,status_at:l.status_at};hap('light');
  const rk={replied:1,dialog:2,call:3,client:4};
  l.status=s;l.status_at=Date.now();if(rk[s])l.reached=Math.max(l.reached||0,rk[s]);
  D.rowsV=(D.rowsV||0)+1;
  const req=api.setStatus(id,s).then(()=>api.statRows()).then(x=>{D.rows=x;D.rowsV=(D.rowsV||0)+1;same('r',x)});
  if(fromList){const row=$(`#llist [data-lead="${id}"]`);hnote('success');if(row&&!LF[D.filter](l))await collapse(row);refreshLeadsUI()}
  req.catch(()=>{Object.assign(l,prev);D.rowsV=(D.rowsV||0)+1;toast('Нет связи, статус не сохранился');refreshLeadsUI()});
}
/* edit lead: patch every local copy, then redraw what is on screen */
function patchLocal(id,patch){[D.leads&&D.leads.rows,D.queue&&D.queue.todo,D.queue&&D.queue.done,D.recent].forEach(p=>p&&p.forEach(l=>{if(l.id===id)Object.assign(l,patch)}))}
function dropLocal(id){if(D.queue){const t=D.queue.todo.length;D.queue.todo=D.queue.todo.filter(l=>l.id!==id);if(D.queue.todo.length<t)D.queue.backlog=Math.max(0,D.queue.backlog-1)}if(D.leads)D.leads.rows=D.leads.rows.filter(l=>l.id!==id);D.recent=D.recent.filter(l=>l.id!==id)}
function redrawTop(){const top=topEl();if(!top)return;const n=top.dataset.name;
  if(n==='queue')refreshQueueUI();else if(n==='leads')refreshLeadsUI();else if(n==='add'){const r=$('#recent',top);r&&(r.innerHTML=recentHTML());const b=$('#backlog',top);b&&D.queue&&(b.textContent=D.queue.backlog)}
  else if(n==='lead'){const e=pushed[pushed.length-1];e&&mount(e.el,'lead',e.params,false)}else{const sc=top.scrollTop;mount(top,n,top===curEl?{}:pushed[pushed.length-1].params,false);top.scrollTop=sc}}
function editLead(id){
  const l=getLead(id);if(!l)return;const own=D.me.role==='owner',canDel=own||l.status==='new';
  sheet(`<h3>Карточка лида</h3><div class="sub">Поменяй ник, добавь вторую соцсеть или исправь имя</div>
<div class="card group" style="margin-top:14px;box-shadow:none;background:var(--fill)"><label class="field" style="height:58px"><span class="fic tg">${ic('tgf',20)}</span><input id="e-tg" value="${esc(l.tg||'')}" placeholder="Telegram, ник или ссылка" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label><div class="hair"></div><label class="field" style="height:58px"><span class="fic ig">${ic('ig',20,1.9)}</span><input id="e-ig" value="${esc(l.ig||'')}" placeholder="Instagram, ник или ссылка" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label><div class="hair"></div><label class="field" style="height:58px"><span class="fic" style="color:var(--ink2)">${ic('userplus',20)}</span><input id="e-nm" value="${esc(l.name||'')}" placeholder="Имя, если знаешь" autocomplete="off"></label></div>
<div style="height:14px"></div><button class="btn p" id="esave">Сохранить</button>${canDel?`<button class="btn danger p" id="edel" style="margin-top:10px;box-shadow:none;height:52px;font-size:15px">${ic('trash',18,2)}Удалить лида</button>`:''}`,(sh,close)=>{
    const g=k=>$('#e-'+k,sh).value;let armed=0;
    $('#esave',sh).onclick=async()=>{
      let t=parseHandle(g('tg')),i=parseHandle(g('ig'));
      if(t&&t.kind==='ig'&&!i){i=t;t=null}else if(i&&i.kind==='tg'&&!t){t=i;i=null}
      if(!t&&!i){hnote('error');toast('Нужен хотя бы один ник');return}
      const patch={tg:t?t.name:'',ig:i?i.name:'',name:g('nm').trim()},oldTg=l.tg;
      patchLocal(id,{tg:patch.tg||null,ig:patch.ig||null,name:patch.name||null});close();hnote('success');redrawTop();
      try{await api.update(id,patch)}catch(e){toast('Нет связи, правка не сохранилась');return}
      if(t&&t.name!==oldTg&&(!l.avatar||!patch.name)){api.tgProfile(t.name).then(r=>{const p={};if(r.avatar&&!l.avatar)p.avatar=r.avatar;if(r.name&&!l.name)p.name=r.name;if(p.avatar||p.name){patchLocal(id,p);redrawTop();api.update(id,p).catch(()=>{})}})}
    };
    const del=$('#edel',sh);if(del)del.onclick=async()=>{
      if(!armed){armed=1;del.lastChild.textContent='Точно удалить?';del.style.color='#fff';del.style.background='#D92D20';hap('light');setTimeout(()=>{if(del.isConnected){armed=0;del.lastChild.textContent='Удалить лида';del.style.color='';del.style.background=''}},3000);return}
      close();const onLead=topEl()&&topEl().dataset.name==='lead';dropLocal(id);hnote('warning');
      if(onLead){await pop()}else redrawTop();
      try{await api.delLead(id)}catch(e){toast('Нет связи, лид не удалился')}
    };
  });
}
function memberSheet(id){
  const m=D.me.members.find(x=>x.id===id);if(!m)return;let tempo=m.tempo;
  sheet(`<h3>${esc(m.name)}</h3><div class="sub">Имя и план на день для этого сеттера</div><input id="m-nm" value="${esc(m.name)}" placeholder="Имя" autocomplete="off">
<div class="stepper" style="margin:6px 0 18px"><button class="sbtn p" data-d="-5" aria-label="Меньше">${ic('minus',22,2)}</button><div class="n" id="m-tv">${tempo}</div><button class="sbtn dark p" data-d="5" aria-label="Больше">${ic('plus',22,2)}</button></div><button class="btn p" id="msave">Сохранить</button>`,(sh,close)=>{
    $$('.sbtn',sh).forEach(b=>b.onclick=()=>{const n=Math.max(5,Math.min(100,tempo+(+b.dataset.d)));if(n===tempo){hnote('warning');return}tempo=n;hap('light');const tv=$('#m-tv',sh);tv.textContent=n;tv.animate([{transform:'scale(1.12)'},{transform:'none'}],{duration:350,easing:EASE})});
    $('#msave',sh).onclick=async()=>{const name=$('#m-nm',sh).value.trim()||m.name;m.name=name;m.tempo=tempo;if(D.team){const t=D.team.find(x=>x.id===id);if(t){t.name=name;t.tempo=tempo}}close();hnote('success');redrawTop();
      try{await api.memberUpdate(id,name,tempo)}catch(e){toast('Нет связи, не сохранилось')}}
  });
}
function segAct(t){const seg=t.closest('.seg');segSet(seg,t.dataset.v);hsel()}

const ACT={
  tab:t=>go(t.dataset.v),
  editlead:(t,e)=>{e.stopPropagation();editLead(t.dataset.id)},member:t=>memberSheet(t.dataset.id),
  who:t=>{D.who=t.dataset.v;$$('#who .chip').forEach(b=>b.classList.toggle('on',b.dataset.v===D.who));hsel();const top=topEl(),n=top&&top.dataset.name;
    if(n==='leads')refreshLeadsUI();else if(n==='stats'){const S=statsCached(D.period);D.S=S;const b=$('#sbody',top);b.innerHTML=statsBody(S,'owner');enhance(b,true)}},
  settings:()=>push('settings',{pushed:true}),
  add:()=>go('add'),queue:()=>go('queue'),statspush:()=>push('stats',{pushed:true}),back:()=>pop(),
  qtab:t=>{D.qtab=t.dataset.v;segAct(t);const l=$('#qlist');l.animate([{opacity:0,transform:'translate3d(0,10px,0)'},{opacity:1,transform:'none'}],{duration:380,easing:EASE});l.innerHTML=qList()},
  sent:t=>doSent(t.dataset.id),unsent:t=>doUnsent(t.dataset.id),
  open:(t,e)=>{e.stopPropagation();hap('light');D.opened[t.dataset.id]=t.dataset.ch;openCh(t.dataset.ch,t.dataset.u)},
  lead:t=>push('lead',{id:t.dataset.id}),
  filter:t=>{D.filter=t.dataset.v;$$('#chips .chip').forEach(b=>b.classList.toggle('on',b===t));hsel();refreshLeadsUI();const l=$('#llist');l&&l.animate([{opacity:.35},{opacity:1}],{duration:200,easing:EASE})},
  quick:(t,e)=>{e.stopPropagation();setLeadStatus(t.dataset.id,'replied',true)},
  period:t=>{D.period=t.dataset.v==='all'?'all':+t.dataset.v;segAct(t);const el=t.closest('.screen'),S=statsCached(D.period);D.S=S;el.classList.remove('still');const b=$('#sbody',el);b.innerHTML=statsBody(S,D.me.role);enhance(b,true)},
  bar:t=>{const S=D.S,s=S.series[+t.dataset.i];$$('.bar').forEach(b=>b.classList.toggle('sel',b===t));hsel();$('#tip').innerHTML=`<b>${esc(s.sub)}</b> отписано ${s.sent}${D.me.role==='setter'?'':', ответили '+s.replied}`},
  setstatus:t=>{const id=t.closest('#sgrid').dataset.id,s=t.dataset.v;$$('#sgrid .sb').forEach(b=>b.classList.toggle('on',b===t));const idx=ORDER.indexOf(s);$$('#steps i').forEach((i,k)=>i.classList.toggle('on',s!=='lost'&&k<=idx));$('#stl').textContent=STATUS[s];setLeadStatus(id,s,false)},
  followers:t=>{const l=getLead(t.dataset.id);sheet(`<h3>Подписчики</h3><div class="sub">Можно писать 8200 или 8,2к</div><input id="fin" inputmode="decimal" placeholder="Например 8,2к" value="${l.followers||''}" autocomplete="off"><button class="btn p" id="fsave">Сохранить</button>`,(sh,close)=>{const i=$('#fin',sh);setTimeout(()=>i.focus(),350);$('#fsave',sh).onclick=async()=>{const n=parseNum(i.value);if(n==null&&i.value.trim()){hnote('error');return}l.followers=n;close();const f=$('#fol');if(f)f.textContent=n?fmtK(n)+' подписчиков':'Указать подписчиков';hnote('success');try{await api.update(l.id,{followers:n==null?'':n})}catch(e){toast('Нет связи')}}})},
  addsocial:t=>{const l=getLead(t.dataset.id),ch=t.dataset.ch;sheet(`<h3>${ch==='tg'?'Telegram':'Instagram'} лида</h3><div class="sub">Ник или ссылка</div><input id="sin" placeholder="@ник или ссылка" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn p" id="ssave">Добавить</button>`,(sh,close)=>{const i=$('#sin',sh);setTimeout(()=>i.focus(),350);$('#ssave',sh).onclick=async()=>{const p=parseHandle(i.value);if(!p){hnote('error');return}const k=p.kind||ch;l[k]=p.name;close();hnote('success');try{await api.update(l.id,{[k]:p.name})}catch(e){toast('Нет связи')}const top=pushed[pushed.length-1];if(top)mount(top.el,'lead',top.params,false)}})},
  copycode:()=>{try{navigator.clipboard.writeText(D.me.code)}catch(e){}hnote('success');toast('Код скопирован')},
  leave:()=>sheet(`<h3>Выйти из команды?</h3><div class="sub">Придется ввести код заново. Лиды останутся в базе.</div><div style="height:16px"></div><button class="btn p" id="lyes" style="background:#D92D20">Выйти</button>`,(sh,close)=>{$('#lyes',sh).onclick=async()=>{close();await api.leave();location.reload()}}),
  /* setup */
  srole:t=>{D.setup.role=t.dataset.v;hsel();$$('.rcard').forEach(b=>b.classList.toggle('on',b===t))},
  snext:async t=>{if(D.setup.role==='owner'){t.disabled=true;try{const r=await api.create(D.tgUser);D.setup.code=r.code;suGo('owner')}catch(e){toast('Нет связи, попробуй еще раз');t.disabled=false}}else suGo('setter')},
  sback:()=>suGo('role'),
  copycode2:()=>{try{navigator.clipboard.writeText(D.setup.code)}catch(e){}hnote('success');toast('Код скопирован')},
  sharecode:()=>{const txt='Код команды в Touch: '+D.setup.code;const u='https://t.me/share/url?url='+encodeURIComponent(location.origin+location.pathname)+'&text='+encodeURIComponent(txt);try{TG&&TG.openTelegramLink?TG.openTelegramLink(u):window.open(u,'_blank')}catch(e){}},
  sdone:()=>enterApp(),
  sjoin:async t=>{const i=$('#codein'),err=$('#serr'),v=i.value.trim().toUpperCase();if(v.length<4){i.classList.remove('bad');void i.offsetWidth;i.classList.add('bad');hnote('error');return}t.disabled=true;try{await api.join(v,D.tgUser);hnote('success');await enterApp()}catch(e){t.disabled=false;i.classList.remove('bad');void i.offsetWidth;i.classList.add('bad');hnote('error');err.textContent=String(e.message).includes('bad_code')?'Такого кода нет, проверь еще раз':'Нет связи, попробуй еще раз'}}
};
function suGo(step){D.setup.step=step;const su=$('#su');su.innerHTML=setupStep();su.animate([{opacity:0,transform:'translate3d(0,16px,0)'},{opacity:1,transform:'none'}],{duration:480,easing:EASE});$('#sbackbtn').style.visibility=step==='setter'?'visible':'hidden';if(step==='setter')setTimeout(()=>{const i=$('#codein');i&&i.focus()},400)}
app.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const f=ACT[t.dataset.act];if(f){f(t,e)}});

/* ============ boot ============ */
function initTG(){
  try{if(TG){TG.ready();TG.expand();TG.setHeaderColor&&TG.setHeaderColor('#F2F2F4');TG.setBackgroundColor&&TG.setBackgroundColor('#F2F2F4');TG.disableVerticalSwipes&&TG.disableVerticalSwipes()}}catch(e){}
  const u=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user;
  D.tgUser=u?{id:u.id,name:u.first_name||u.username||'Пользователь',photo:u.photo_url||null}:{id:null,name:DEMO?null:'Гость',photo:null};
  if(DEMO&&!D.tgUser.name)D.tgUser=null;
}
async function enterApp(pre){
  if(!pre)await loadAll();drawTabs();
  host.innerHTML='';curEl=null;curTab=null;$$('.screen.pushed').forEach(x=>x.remove());pushed.length=0;
  tabbar.style.display='';await go(TABS[D.me.role][0][0],true);
  if(D.me.role==='setter'&&D.tgUser&&D.tgUser.photo&&D.me.photo!==D.tgUser.photo)api.profile(D.tgUser.name,D.tgUser.photo).catch(()=>{});
}
function showSetup(){tabbar.style.display='none';host.innerHTML='';const el=document.createElement('div');el.className='screen';el.style.paddingBottom='28px';mount(el,'setup',{},true);host.appendChild(el);curEl=el;curTab='setup'}
async function boot(){
  initTG();const t0=performance.now();
  if(DEMO){const r=new URLSearchParams(location.search).get('role');if(r){dinit(r);TOKEN='demo';localStorage.setItem('touch_token','demo')}else dinit(localStorage.getItem('touch_token')?undefined:'owner')}
  let ok=false;
  try{if(TOKEN){await loadAll();ok=true}}catch(e){if(/auth/.test(String(e.message))){localStorage.removeItem('touch_token');TOKEN=''}else{ok=false}}
  const wait=Math.max(0,1500-(performance.now()-t0));await sleep(wait);
  if(ok)await enterApp(true);else showSetup();
  const s=$('#splash');s.classList.add('out');setTimeout(()=>s.remove(),700);
}
boot();
