<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F2F2F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Touch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#F2F2F4;--card:#fff;--ink:#111113;--ink2:#6B6B70;--ink3:#A1A1A6;
  --line:rgba(17,17,19,.08);--fill:#EEEEF1;--fill2:#E4E4E8;
  --tg:#229ED9;--tgBg:#E4F3FB;--tgInk:#14729F;--igBg:#FBEAF1;--igInk:#B8245A;--ok:#1E9A55;--okBg:#E6F6EC;--bad:#D92D20;
  --ease:cubic-bezier(.32,.72,0,1);--out:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.5,.64,1);
  --sh:0 0 0 .5px rgba(17,17,19,.05),0 1px 2px rgba(17,17,19,.04),0 10px 28px rgba(17,17,19,.04);
  --shb:0 0 0 .5px rgba(17,17,19,.07),0 1px 2px rgba(17,17,19,.05),0 6px 12px -6px rgba(17,17,19,.10);
  --tgGrad:linear-gradient(155deg,#2DA8E0 0%,#1B86BF 55%,#146A9E 100%);
  --igGrad:linear-gradient(45deg,#EE8F2E 0%,#D4255F 52%,#6F2FA9 100%);
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;margin:0;height:100%;background:#E9E9EC;color:var(--ink);font-family:Manrope,-apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
a{color:inherit;text-decoration:none}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg);contain:layout paint}
.screen{will-change:transform;position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;background:var(--bg);padding:calc(var(--st) + 16px) 20px calc(122px + var(--sb));backface-visibility:hidden}
.screen.pushed{z-index:30;box-shadow:-14px 0 40px rgba(17,17,19,.10);padding-bottom:calc(40px + var(--sb))}
.screen::-webkit-scrollbar{display:none}
.ic{display:block;flex:none}

/* motion */
@keyframes rise{from{opacity:0;transform:translate3d(0,16px,0)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes shimmer{from{background-position:-200px 0}to{background-position:200px 0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ripple{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.anim>*{animation:rise .6s var(--out) both;animation-delay:calc(var(--si,0)*42ms)}
.p{transition:transform .2s var(--ease),opacity .2s,background-color .25s,color .25s}
.p:active{transform:scale(.955);opacity:.88}

/* type */
.title{margin:4px 0 2px;font-weight:800;font-size:34px;line-height:1.08;letter-spacing:-1.1px}
.sub{font-size:14px;font-weight:500;color:var(--ink2)}
.h2{margin:0;font-weight:800;font-size:21px;letter-spacing:-.5px}
.cap{font-size:13px;font-weight:600;color:var(--ink2)}
.big{font-weight:700;font-size:46px;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.hint{margin:10px 6px 0;font-size:13px;font-weight:500;line-height:1.45;color:var(--ink2)}
.sech{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}

/* layout bits */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;min-height:48px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.nm{font-weight:800;font-size:21px;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowb{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.between{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--sh)}

/* buttons: black is flat, white has a soft shadow */
.roundbtn{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:var(--shb);display:grid;place-items:center;flex:none}
.roundbtn.dark{background:var(--ink);color:#fff;box-shadow:none}
.pillw{background:#fff;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;box-shadow:var(--shb);white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:58px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;letter-spacing:-.1px;box-shadow:none}
.btn:disabled{background:#CFCFD4;color:#fff;pointer-events:none}
.btn.white{background:#fff;color:var(--ink);box-shadow:var(--shb)}
.btn.danger{background:#fff;color:var(--bad);box-shadow:var(--shb)}
.btn.sm{height:50px;font-size:15px}

/* avatar and brand badges */
.av{--s:48px;width:var(--s);height:var(--s);border-radius:50%;position:relative;overflow:hidden;flex:none;display:grid;place-items:center;font-weight:700;font-size:calc(var(--s)*.34);letter-spacing:-.3px}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fade .4s both}
.avstack{display:flex}.avstack .av{box-shadow:0 0 0 2.5px #fff}.avstack .av+.av,.avstack .more{margin-left:-10px}
.more{width:32px;height:32px;border-radius:50%;background:var(--fill);box-shadow:0 0 0 2.5px #fff;display:grid;place-items:center;font-size:11.5px;font-weight:700}
.bd{--s:22px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.bd.tg{background:var(--tgGrad)}.bd.ig{background:var(--igGrad)}
.bd.tg .ic{margin-left:-1px}

/* hero add */
.hero{display:flex;align-items:center;gap:15px;width:100%;text-align:left;background:var(--ink);color:#fff;border-radius:30px;height:76px;padding:0 16px 0 15px;box-shadow:none}
.hero .pl{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;flex:none}
.hero .tx{flex:1;display:flex;flex-direction:column;gap:3px}.hero b{font-size:17px;font-weight:700;letter-spacing:-.2px}.hero .tx>span{font-size:13px;font-weight:500;color:#A9A9AF}

/* tiles */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:16px;height:196px;display:flex;flex-direction:column;text-align:left}
.tile .t1{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:15px}
.gauge{position:relative;margin-top:14px;height:86px}
.gauge svg{display:block;width:100%;height:86px}
.gauge .gfg{transition:stroke-dashoffset 1.2s var(--out)}
.gauge .gn{position:absolute;left:0;right:0;bottom:0;text-align:center;font-weight:700;font-size:36px;line-height:1;letter-spacing:-1.4px}
.tile .gs{margin-top:10px;text-align:center;font-size:13px;font-weight:500;color:var(--ink2)}
.tile .n{margin-top:10px;font-weight:700;font-size:54px;line-height:1;letter-spacing:-2.4px}
.tile .nl{margin-top:5px;font-size:13px;font-weight:500;color:var(--ink2)}
.tile .fill{flex:1}
.wide{display:flex;align-items:center;gap:16px;padding:18px 18px 18px 20px;width:100%;text-align:left}
.wide .l{flex:1;min-width:0}
.mini{display:flex;align-items:flex-end;gap:5px;height:70px;width:120px;flex:none}
.mini i{flex:1;border-radius:6px;background:#DADADF;transform-origin:bottom;animation:grow .8s var(--out) both;animation-delay:calc(var(--i)*55ms + .2s)}
.mini i.on{background:var(--ink)}
.delta{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;background:var(--okBg);color:var(--ok)}
.delta.neg{background:#FDEBEA;color:var(--bad)}.delta.zero{background:var(--fill);color:var(--ink2)}

/* segmented */
.seg{--n:2;--i:0;position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(118,118,128,.12);border-radius:999px;padding:3px;margin:14px 0}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 3px 8px rgba(0,0,0,.05);transform:translate3d(calc(var(--i)*100%),0,0);transition:transform .5s var(--ease)}
.seg button{position:relative;height:40px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink2);transition:color .3s}
.seg button.on{color:var(--ink)}
.prog{height:6px;border-radius:99px;background:var(--fill2);overflow:hidden;margin:14px 0 0}
.prog i{display:block;height:100%;width:100%;background:var(--ink);border-radius:99px;transform-origin:left;transition:transform .8s var(--out)}

/* rows */
.list{display:flex;flex-direction:column}
.lrow{content-visibility:auto;contain-intrinsic-size:auto 78px;display:flex;align-items:center;gap:12px;background:#fff;border-radius:24px;box-shadow:var(--sh);padding:12px 14px;margin-bottom:10px;width:100%;text-align:left;transition:transform .2s var(--ease)}
button.lrow:active,.lrow.p:active{transform:scale(.985)}
.lmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.lname{font-weight:700;font-size:16px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chs{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0;max-width:100%}
.ch{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px 0 5px;border-radius:999px;font-size:12.5px;font-weight:700;max-width:100%;white-space:nowrap}
.ch .bd{--s:20px}
.ch>span:not(.bd){overflow:hidden;text-overflow:ellipsis}
.ch.tg{background:var(--tgBg);color:var(--tgInk)}.ch.ig{background:var(--igBg);color:var(--igInk)}
.sendbtn{height:42px;padding:0 18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;flex:none;box-shadow:none}
.okc{width:36px;height:36px;border-radius:50%;background:var(--okBg);color:var(--ok);display:grid;place-items:center;flex:none}
.again-tag{font-size:12px;font-weight:700;color:var(--ink2)}

/* one status system: same size, same shape, a scale from grey to green */
.sp{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;flex:none;background:var(--fill);color:var(--ink2)}
.sp.replied{background:#E6F6EC;color:#1E8A4E}
.sp.dialog{background:#D3EFDD;color:#157A43}
.sp.call{background:#BDE6CC;color:#0E6A3A}
.sp.client{background:var(--ok);color:#fff}
.sp.unfit{background:var(--fill);color:var(--ink3)}
.sp.lost{background:#FDEBEA;color:#C0281D}
.quick{height:34px;padding:0 14px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:13px;flex:none;box-shadow:none}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:44px 20px;gap:12px;color:var(--ink2);font-weight:600;font-size:15px}
.empty .big2{width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:var(--sh);display:grid;place-items:center}
.empty svg path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .7s .15s var(--out) forwards}
.empty b{color:var(--ink);font-size:18px;letter-spacing:-.3px}

/* chips filter */
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -20px 14px;padding:2px 20px 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{height:40px;padding:0 15px;border-radius:999px;background:#fff;box-shadow:var(--shb);font-weight:700;font-size:14px;white-space:nowrap;flex:none;display:flex;align-items:center;gap:7px;transition:background-color .3s,color .3s}
.chip i{font-style:normal;font-size:12px;opacity:.55}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}

/* add */
.paste{display:block;width:100%;min-height:150px;border:0;outline:0;resize:none;background:none;padding:18px 20px;font-weight:600;font-size:17px;line-height:1.55;letter-spacing:-.2px}
.paste::placeholder{color:var(--ink3);font-weight:500}
.pv{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:10px;animation:rise .45s var(--out) both;animation-delay:calc(var(--si,0)*35ms)}
.pv .t{flex:1;min-width:0}.pv b{display:block;font-size:16px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pv .t span{font-size:13px;color:var(--ink2);font-weight:500}
.sk{border-radius:50%;background:linear-gradient(90deg,#EEE 0,#F7F7F8 100px,#EEE 200px);background-size:400px 100%;animation:shimmer 1.2s linear infinite}
.found{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 4px}
.cnt{display:flex;gap:8px}
.cnt>span{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px 0 5px;border-radius:999px;background:#fff;box-shadow:var(--shb);font-size:13px;font-weight:700}
.cnt .bd{--s:20px}
.addbar{position:sticky;bottom:calc(8px + var(--sb));margin-top:18px;z-index:5}

/* stats */
.chart{position:relative;display:flex;align-items:flex-end;gap:var(--g,6px);height:150px;margin-top:20px}
.bar{flex:1;height:100%;position:relative;display:flex;align-items:flex-end}
.bar .b1{display:block;width:100%;height:calc(var(--h)*1%);min-height:4px;border-radius:7px;background:#DCDCE1;transform-origin:bottom;animation:grow .8s var(--out) both;animation-delay:calc(var(--i)*22ms);transition:background-color .3s}
.bar .b2{position:absolute;left:0;right:0;bottom:0;height:calc(var(--h2)*1%);border-radius:7px;background:var(--ink);transform-origin:bottom;animation:grow .8s var(--out) both;animation-delay:calc(var(--i)*22ms + 120ms)}
.bar.sel .b1{background:#B4B4BB}
.plan{position:absolute;left:0;right:0;border-top:1.5px dashed #C2C2C9;pointer-events:none}
.plan span{position:absolute;right:0;top:-22px;font-size:11px;font-weight:700;color:var(--ink2)}
.axis{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;font-weight:600;color:var(--ink2)}
.tip{margin-top:14px;font-size:13px;font-weight:600;color:var(--ink2);min-height:18px}.tip b{color:var(--ink)}
.legend{display:flex;gap:14px;margin-top:12px;font-size:12px;font-weight:600;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.fun{padding:20px;margin-top:12px}
.fr{margin-top:16px}.fr:first-of-type{margin-top:18px}
.fr .h{display:flex;align-items:baseline;justify-content:space-between;font-weight:600;font-size:14px;color:var(--ink2)}
.fr .h b{color:var(--ink);font-size:22px;font-weight:800;letter-spacing:-.6px;margin-left:8px;font-variant-numeric:tabular-nums}
.fr .tr{height:12px;border-radius:7px;background:var(--fill);margin-top:8px;overflow:hidden}
.fr .tr i{display:block;height:100%;border-radius:7px;transform-origin:left;animation:growx 1s var(--out) both;animation-delay:calc(var(--i)*90ms + .1s)}
.pc{font-size:12px;font-weight:700;background:var(--fill);border-radius:999px;padding:4px 9px;color:var(--ink)}
.sumline{display:flex;justify-content:space-between;align-items:center;background:var(--fill);border-radius:16px;padding:14px 16px;margin-top:20px;font-size:14px;font-weight:600;color:#3A3A3F}.sumline b{font-size:17px;color:var(--ink)}
.plate{position:relative;overflow:hidden;border-radius:26px;padding:16px;color:#fff;display:flex;flex-direction:column;gap:4px;min-height:176px}
.plate.tg{background:var(--tgGrad);box-shadow:0 14px 24px -14px rgba(20,106,158,.65)}
.plate.ig{background:var(--igGrad);box-shadow:0 14px 24px -14px rgba(180,36,90,.6)}
.plate::after{content:"";position:absolute;right:-34px;top:-34px;width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.12)}
.plate .hd{position:relative;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;z-index:1}
.plate .hd .bd{--s:28px;background:rgba(255,255,255,.22)}
.plate .v{position:relative;z-index:1;font-weight:700;font-size:44px;letter-spacing:-1.8px;line-height:1.05;margin-top:auto;font-variant-numeric:tabular-nums}
.plate .s{position:relative;z-index:1;font-size:13px;font-weight:600;color:rgba(255,255,255,.82)}
.plate .tr{position:relative;z-index:1;height:6px;border-radius:4px;background:rgba(255,255,255,.28);margin-top:8px;overflow:hidden}
.plate .tr i{display:block;height:100%;border-radius:4px;background:#fff;transform-origin:left;animation:growx 1s .25s var(--out) both}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tl{padding:14px 12px}.tl b{display:block;font-size:26px;font-weight:800;letter-spacing:-1px;margin-top:6px}.tl span{font-size:12px;font-weight:600;color:var(--ink2);line-height:1.3;display:block}

/* lead card */
.lhead{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 18px 20px;text-align:center}
.lhead .av{box-shadow:0 0 0 4px #fff,0 10px 26px rgba(17,17,19,.12)}
.lhead h1{margin:12px 0 0;font-size:27px;font-weight:800;letter-spacing:-.8px}
.lhead .hn{font-size:14px;font-weight:500;color:var(--ink2)}
.cbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:16px}
.cbtns.one{grid-template-columns:1fr}
.cbtn{height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:15px;color:#fff}
.cbtn.tg{background:var(--tgGrad);box-shadow:0 10px 18px -12px rgba(20,106,158,.8)}
.cbtn.ig{background:var(--igGrad);box-shadow:0 10px 18px -12px rgba(180,36,90,.8)}
.cbtn.add{background:#fff;color:var(--ink2);box-shadow:var(--shb)}
.fchip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;background:var(--fill);font-weight:700;font-size:13px;margin-top:6px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sb{height:72px;border-radius:20px;background:#fff;box-shadow:var(--shb);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:13px;transition:background-color .3s,color .3s,transform .2s var(--ease)}
.sb.on{background:var(--ink);color:#fff;box-shadow:none}.sb.on.client{background:var(--ok)}.sb.on.lost{background:var(--bad)}
.sb:active{transform:scale(.95)}
.sec{padding:18px;margin-top:12px}
.sec h3{margin:0 0 12px;font-size:17px;font-weight:800;letter-spacing:-.3px}
.touch{display:flex;align-items:center;gap:12px;padding:10px 0}
.touch+.touch{border-top:.5px solid var(--line)}
.touch .dot{width:34px;height:34px;border-radius:50%;background:var(--fill);display:grid;place-items:center;flex:none;color:var(--ink2)}
.touch .dot.on{background:var(--ink);color:#fff}
.touch b{display:block;font-size:15px;letter-spacing:-.2px}.touch span{font-size:13px;font-weight:500;color:var(--ink2)}
.notebox{padding:16px 18px;margin-top:12px}.notebox textarea{width:100%;min-height:84px;border:0;outline:0;resize:none;background:none;font-weight:500;font-size:15px;line-height:1.5}
.notebox textarea::placeholder{color:var(--ink3)}

/* settings */
.stepcard{padding:18px 18px 20px;margin-top:12px}
.stepcard .cap{font-size:14px;color:var(--ink)}
.stepper{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.stepper .n{display:flex;align-items:baseline;font-weight:700;font-size:60px;letter-spacing:-3px;line-height:1;font-variant-numeric:tabular-nums}
.stepper .n small{font-size:20px;font-weight:700;letter-spacing:-.4px;margin-left:8px;color:var(--ink2)}
.sbtns{display:flex;gap:10px}
.sbtn{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:var(--shb);display:grid;place-items:center}
.sbtn.dark{background:var(--ink);color:#fff;box-shadow:none}
.irow{display:flex;align-items:center;gap:12px;padding:16px 18px;font-size:15px;font-weight:600;width:100%;text-align:left}

  const h={apikey:CFG.key,'Content-Type':'application/json'};
  if(!CFG.key.startsWith('sb_'))h.Authorization='Bearer '+CFG.key;
  const r=await fetch(CFG.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args)});
  if(!r.ok){let m='http '+r.status;try{m=(await r.json()).message||m}catch(e){}throw new Error(m)}
  const t=await r.text();return t?JSON.parse(t):null;
}

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const NAMES=[['Анна Котова','kotova_anna'],['Игорь Белов','belov_coach'],['Марина Лис','marina_lis'],['Денис Ершов','ershov_train'],['Ольга Сим','olga_sim'],['Кирилл Жуков','kirill_zhukov'],['Павел Рябов','ryabov_pro'],['Алина Нур','alina_nur'],['Тимур Асанов','timur_fit'],['Вика Громова','vika_gromova'],['Роман Лель','roman_lel'],['Наташа Ким','natasha_kim'],['Артур Бут','artur_boot'],['Лена Орлова','lena_orlova'],['Макс Рид','max_read'],['Соня Мур','sonya_moor'],['Глеб Ким','gleb_kim'],['Ира Вест','ira_west'],['Влад Нова','vlad_nova'],['Диана Ли','diana_lee']];
function seedDemo(){
  const R=rng(7),day=864e5,now=Date.now(),leads=[];let n=0;
  const mk=(o)=>{const b=NAMES[n%NAMES.length];const k=Math.floor(n/NAMES.length);const l=Object.assign({id:'d'+(++n),tg:null,ig:null,name:b[0],avatar:null,followers:null,note:'',status:'new',reached:0,channel:null,created_at:now-(2000-n)*6e4,sent_at:null,again_at:null,again_channel:null,status_at:null},o);const h=b[1]+(k?k:'');
    const ch=o.channel||(R()<.6?'tg':'ig');if(R()<.55||ch==='tg')l.tg=h;if(R()<.55||ch==='ig')l.ig=h+(R()<.5?'.fit':'');if(ch==='tg'&&!l.tg)l.tg=h;if(ch==='ig'&&!l.ig)l.ig=h+'.fit';
    if(l.sent_at)l.channel=ch;l.followers=Math.round(2000+R()*18000);return l};
  for(let d=29;d>=0;d--){const cnt=d===0?12:Math.round(14+R()*8)+(d<10?Math.floor((10-d)/3):0);
    for(let i=0;i<cnt;i++){const t=now-d*day-(i*17+3)*6e4;const l=mk({sent_at:t,status:'sent'});l.status_at=t;
      if(R()<.23+(d<15?.04:0)){const q=R();l.reached=q<.55?1:q<.8?2:q<.93?3:4;l.status=['','replied','dialog','call','client'][l.reached];if(R()<.12)l.status=R()<.5?'lost':'unfit';l.status_at=t+3600e3}
      else if(d>=3&&d<9&&R()<.45){l.again_at=t+3*day;l.again_channel=l.channel}
      leads.push(l)}}
  for(let i=0;i<53;i++)leads.push(mk({}));
  return {tz:'Asia/Tbilisi',leads,me:{name:'Артем',photo:null,tempo:25,repeat:3},v:3};
}

function parseList(txt,kind){
  const out=[],seen=new Set();
  for(const raw of String(txt||'').split(/[\n,;]+/)){
    const line=raw.trim();if(!line)continue;
    const m=line.match(/(?:https?:\/\/)?(?:www\.|m\.)?(?:t\.me|telegram\.me|instagram\.com|instagr\.am)\/@?[A-Za-z0-9._]+/i);
    const tok=m?m[0]:(line.split(/\s+/).find(w=>/^@?[A-Za-z0-9._]{2,}$/.test(w))||line.split(/\s+/)[0]);
    const h=parseHandle(tok);if(!h)continue;const ch=h.kind||kind,key=ch+':'+h.name;
    if(seen.has(key))continue;seen.add(key);out.push({ch,u:h.name});
  }
  return out;
}

function countUp(n,first){const v=+n.dataset.count||0;if(!first||v===0){n.textContent=v;return}const t0=performance.now(),dur=1000;(function f(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,4);n.textContent=Math.round(v*e);if(k<1)requestAnimationFrame(f)})(t0)}

/* ============ liquid glass tab bar ============ */
const TW=84,TMAX=(TABS.length-1)*TW;
const tabIdx=()=>Math.max(0,TABS.findIndex(x=>x[0]===curTab));
const thumbEl=()=>tabbar.querySelector('.thumb');
function drawTabs(){tabbar.innerHTML=`<i class="thumb"></i>`+TABS.map(x=>`<button class="tab" data-v="${x[0]}" aria-label="${x[1]}">${ic(x[2],24,1.8)}${x[1]}</button>`).join('');tabbar.style.setProperty('--tw',TW+'px')}
function paintTabs(i){$$('.tab',tabbar).forEach((b,k)=>b.classList.toggle('on',k===i))}
function markTab(name){const i=Math.max(0,TABS.findIndex(x=>x[0]===name));const t=thumbEl();t.style.setProperty('--x',i*TW+'px');t.style.setProperty('--sx',1);t.style.setProperty('--sy',1);paintTabs(i)}
(function(){
  let st=null;
  function tick(){
    if(!st)return;const d=st.tx-st.x,a=Math.abs(d);
    st.x+=d*.26;st.sx+=((1.1+Math.min(.12,a/150))-st.sx)*.22;st.sy+=((1.1-Math.min(.05,a/320))-st.sy)*.22;
    const t=thumbEl();t.style.setProperty('--x',st.x.toFixed(1)+'px');t.style.setProperty('--sx',st.sx.toFixed(3));t.style.setProperty('--sy',st.sy.toFixed(3));
    const i=clamp(Math.round(st.x/TW),0,TABS.length-1);if(i!==st.idx){st.idx=i;hsel();paintTabs(i)}
    st.raf=requestAnimationFrame(tick);
  }
  const at=e=>clamp(e.clientX-st.left-6-TW/2,0,TMAX);
  tabbar.addEventListener('pointerdown',e=>{
    if((e.pointerType==='mouse'&&e.button!==0)||tabbar.classList.contains('hide')||st)return;
    const r=tabbar.getBoundingClientRect(),c=tabIdx();
    st={left:r.left,x:c*TW,tx:0,sx:1,sy:1,idx:c,x0:e.clientX,moved:0,pid:e.pointerId,t0:performance.now()};st.tx=at(e);
    try{tabbar.setPointerCapture(e.pointerId)}catch(_){}
    tabbar.classList.add('hold','drag');hap('light');tick();
  });
  tabbar.addEventListener('pointermove',e=>{if(!st||e.pointerId!==st.pid)return;st.tx=at(e);st.moved=Math.max(st.moved,Math.abs(e.clientX-st.x0))});
  const end=e=>{
    if(!st||e.pointerId!==st.pid)return;
    cancelAnimationFrame(st.raf);const tap=st.moved<6&&performance.now()-st.t0<500;
    const i=clamp(Math.round(st.tx/TW),0,TABS.length-1),prev=tabIdx();st=null;
    tabbar.classList.remove('hold','drag');
    if(e.type==='pointercancel'){markTab(curTab);return}
    markTab(TABS[i][0]);
    if(i!==prev||tap)go(TABS[i][0]);
  };
  tabbar.addEventListener('pointerup',end);tabbar.addEventListener('pointercancel',end);
})();

async function go(name,instant){
  if(pushed.length)await popAll();
  if(curTab===name&&curEl){curEl.scrollTo({top:0,behavior:'smooth'});return}
  const el=document.createElement('div');el.className='screen';mount(el,name,{},true);
  const old=curEl;curEl=el;curTab=name;host.appendChild(el);markTab(name);
  if(old&&!instant){el.animate([{opacity:0,transform:'translate3d(0,14px,0)'},{opacity:1,transform:'none'}],{duration:300,easing:EASE});old.animate([{opacity:1},{opacity:0}],{duration:100,fill:'forwards'}).finished.then(()=>old.remove())}
  else if(old)old.remove();
  setTimeout(()=>silentRefresh(),700);
}
async function push(name,params){
  const el=document.createElement('div');el.className='screen pushed';mount(el,name,params,true);app.appendChild(el);
  const under=topEl();const e={el,name,params,under};pushed.push(e);
  el.animate([{transform:'translate3d(100%,0,0)'},{transform:'none'}],{duration:480,easing:EASE});
  e.ua=under.animate([{transform:'none',filter:'brightness(1)'},{transform:'translate3d(-24%,0,0)',filter:'brightness(.93)'}],{duration:480,easing:EASE,fill:'both'});
  tabbar.classList.add('hide');setBack();hsel();
}
async function pop(){
  const e=pushed.pop();if(!e)return;setBack();if(!pushed.length)tabbar.classList.remove('hide');
  e.ua.playbackRate=-1;e.ua.play();
  const a=e.el.animate([{transform:'none'},{transform:'translate3d(100%,0,0)'}],{duration:420,easing:EASE,fill:'forwards'});
  await a.finished;e.el.remove();e.ua.cancel();
  redrawTop();silentRefresh(true);
}
async function popAll(){while(pushed.length){const e=pushed.pop();e.el.remove();e.ua.cancel()}setBack();tabbar.classList.remove('hide')}
if(TG&&TG.BackButton)TG.BackButton.onClick(()=>pop());

/* swipe back */
(function(){let s=null;const left=()=>app.getBoundingClientRect().left;
  app.addEventListener('touchstart',ev=>{if(!pushed.length||ev.touches.length>1)return;const t=ev.touches[0];if(t.clientX-left()>24)return;s={x:t.clientX,y:t.clientY,t:performance.now(),lock:false,dx:0,e:pushed[pushed.length-1]}},{passive:true});
  app.addEventListener('touchmove',ev=>{if(!s)return;const t=ev.touches[0],dx=t.clientX-s.x,dy=t.clientY-s.y;
    if(!s.lock){if(Math.abs(dy)>Math.abs(dx)*1.2&&Math.abs(dy)>8){s=null;return}if(dx>8){s.lock=true;s.e.ua.pause()}else return}
    ev.preventDefault();s.dx=Math.max(0,dx);const w=app.clientWidth;s.e.el.style.transform=`translate3d(${s.dx}px,0,0)`;s.e.ua.currentTime=(1-Math.min(1,s.dx/w))*480},{passive:false});
  app.addEventListener('touchend',async()=>{if(!s||!s.lock){s=null;return}const w=app.clientWidth,v=s.dx/Math.max(1,performance.now()-s.t),done=s.dx>w*.34||v>.55,e=s.e;s=null;
    if(done){pushed.pop();setBack();if(!pushed.length)tabbar.classList.remove('hide');e.ua.playbackRate=-1;e.ua.play();const a=e.el.animate([{transform:e.el.style.transform},{transform:'translate3d(100%,0,0)'}],{duration:300,easing:EASE,fill:'forwards'});e.el.style.transform='';await a.finished;e.el.remove();e.ua.cancel();redrawTop();silentRefresh(true)}
    else{const a=e.el.animate([{transform:e.el.style.transform},{transform:'none'}],{duration:300,easing:EASE});e.el.style.transform='';e.ua.playbackRate=1;e.ua.play();await a.finished}});

async function silentRefresh(force){
  if(!D.me||document.hidden||busy.size)return;
  const ae=document.activeElement;if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))return;
  const top=topEl();if(!top||document.querySelector('.sheet'))return;const n=top.dataset.name;
  if(n==='settings'||n==='add'||n==='lead')return;
  try{
    let ch=false;
    const get=async(k,fn,set)=>{const v=await fn();if(!same(k,v)){set(v);ch=true}};
    await get('q',api.queue,v=>{D.queue=v;D.me.tempo=v.tempo;D.me.repeat=v.repeat});
    await get('r',api.statRows,v=>{D.rows=v;D.rowsV=(D.rowsV||0)+1});
    if(n==='leads'||force)await get('l',api.leads,v=>{D.leads=v});
    if(!ch&&!force)return;
    redrawTop();
  }catch(e){}
}
setInterval(silentRefresh,8000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)silentRefresh(true)});

/* ============ actions ============ */
function collapse(row){const h=row.offsetHeight;row.style.overflow='hidden';return row.animate([{height:h+'px',opacity:1,transform:'none',marginBottom:'10px'},{height:'0px',opacity:0,transform:'translate3d(48px,0,0) scale(.96)',marginBottom:'0px',paddingTop:'0px',paddingBottom:'0px'}],{duration:280,easing:EASE,fill:'forwards'}).finished}
function openCh(ch,u){const url=(ch==='tg'?'https://t.me/':'https://instagram.com/')+u;try{if(TG){ch==='tg'&&TG.openTelegramLink?TG.openTelegramLink(url):TG.openLink(url)}else window.open(url,'_blank','noopener')}catch(e){window.open(url,'_blank')}}
function addLeadRow(l){if(D.leads&&!D.leads.rows.some(x=>x.id===l.id))D.leads.rows.unshift(l)}
async function doSent(id,kind){
  const q=D.queue,list=kind==='again'?q.again:q.todo,i=list.findIndex(l=>l.id===id);if(i<0||busy.has(id))return;busy.add(id);hap('medium');
  const l=list[i],row=$(`#${kind==='again'?'qagain':'qfirst'} [data-lead="${id}"]`);
  const dflt=kind==='again'?(l[l.channel]?l.channel:(l.tg?'tg':'ig')):(l.tg?'tg':'ig'),ch=D.opened[id]||dflt;
  const prev={status:l.status,sent_at:l.sent_at,channel:l.channel,status_at:l.status_at,again_at:l.again_at,again_channel:l.again_channel};
  const req=kind==='again'?api.setAgain(id,true,ch):api.setSent(id,true,ch);
  if(row)await collapse(row);
  list.splice(i,1);
  if(kind==='again'){l.again_at=Date.now();l.again_channel=ch}
  else{l.status='sent';l.sent_at=Date.now();l.status_at=l.sent_at;l.channel=ch;q.sentToday++;q.backlog--;D.rows=(D.rows||[]).concat([[todayIn(tzOf()),ch,0]]);D.rowsV=(D.rowsV||0)+1;addLeadRow(l)}
  q.done.unshift(l);refreshQueueUI();hnote('success');
  toast('Отписано','Отменить',()=>doUnsent(id));
  try{await req;same('q',q)}
  catch(e){Object.assign(l,prev);q.done=q.done.filter(x=>x.id!==id);list.splice(i,0,l);if(kind!=='again'){q.sentToday--;q.backlog++;D.rows=D.rows.slice(0,-1);D.rowsV++;if(D.leads)D.leads.rows=D.leads.rows.filter(x=>x.id!==id)}refreshQueueUI();toast('Нет связи, не сохранилось')}
  busy.delete(id);
}
async function doUnsent(id){
  const q=D.queue,l=q.done.find(x=>x.id===id);if(!l)return;hap('light');
  const wasAgain=againToday(l)&&!isToday(l.sent_at);
  q.done=q.done.filter(x=>x.id!==id);
  if(wasAgain){l.again_at=null;l.again_channel=null;q.again.push(l);q.again.sort((a,b)=>a.sent_at-b.sent_at)}
  else{l.status='new';l.sent_at=null;l.channel=null;l.again_at=null;q.todo.push(l);q.todo.sort((a,b)=>a.created_at-b.created_at);q.sentToday--;q.backlog++;if(D.leads)D.leads.rows=D.leads.rows.filter(x=>x.id!==id)}
  redrawTop();
  try{await(wasAgain?api.setAgain(id,false,null):api.setSent(id,false,null));api.statRows().then(r=>{D.rows=r;D.rowsV=(D.rowsV||0)+1}).catch(()=>{})}catch(e){toast('Нет связи')}
}
async function setLeadStatus(id,s,fromList){
  const l=getLead(id);if(!l||l.status===s)return;const prev={status:l.status,reached:l.reached,status_at:l.status_at};hap('light');
  const rk={replied:1,dialog:2,call:3,client:4};
  patchLocal(id,{status:s,status_at:Date.now(),reached:rk[s]?Math.max(l.reached||0,rk[s]):l.reached});
  D.rowsV=(D.rowsV||0)+1;
  const req=api.setStatus(id,s).then(()=>api.statRows()).then(x=>{D.rows=x;D.rowsV=(D.rowsV||0)+1;same('r',x)});
  if(fromList){const row=$(`#llist [data-lead="${id}"]`);hnote('success');if(row&&!LF[D.filter](l))await collapse(row);refreshLeadsUI()}
  req.catch(()=>{patchLocal(id,prev);D.rowsV=(D.rowsV||0)+1;toast('Нет связи, статус не сохранился');redrawTop()});
}
function patchLocal(id,patch){[D.leads&&D.leads.rows,D.queue&&D.queue.todo,D.queue&&D.queue.again,D.queue&&D.queue.done].forEach(p=>p&&p.forEach(l=>{if(l.id===id)Object.assign(l,patch)}))}
function dropLocal(id){const q=D.queue;if(q){const t=q.todo.length;q.todo=q.todo.filter(l=>l.id!==id);if(q.todo.length<t)q.backlog=Math.max(0,q.backlog-1);q.again=q.again.filter(l=>l.id!==id);q.done=q.done.filter(l=>l.id!==id)}if(D.leads)D.leads.rows=D.leads.rows.filter(l=>l.id!==id)}
function redrawTop(){const top=topEl();if(!top)return;const n=top.dataset.name;
  if(n==='queue')refreshQueueUI();else if(n==='leads')refreshLeadsUI();else if(n==='add'){const b=$('#backlog',top);b&&D.queue&&(b.textContent=D.queue.backlog)}
  else if(n==='lead'){const e=pushed[pushed.length-1];e&&mount(e.el,'lead',e.params,false)}
  else if(n==='settings'){}
  else{const sc=top.scrollTop;mount(top,n,top===curEl?{}:pushed[pushed.length-1].params,false);top.scrollTop=sc}}
function editLead(id){
  const l=getLead(id);if(!l)return;
  sheet(`<h3>Изменить лида</h3><div class="sub">Поменяй ник, добавь вторую соцсеть или исправь имя</div>
<div class="grp"><label class="field"><span class="fi">${badge('tg',26)}</span><input id="e-tg" value="${esc(l.tg||'')}" placeholder="Telegram, ник или ссылка" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label><div class="hair"></div><label class="field"><span class="fi">${badge('ig',26)}</span><input id="e-ig" value="${esc(l.ig||'')}" placeholder="Instagram, ник или ссылка" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label><div class="hair"></div><label class="field"><span class="fi">${ic('user',20,2)}</span><input id="e-nm" value="${esc(l.name||'')}" placeholder="Имя, если знаешь" autocomplete="off"></label></div>
<div style="height:14px"></div><button class="btn p" id="esave">Сохранить</button><button class="btn danger p sm" id="edel" style="margin-top:10px">${ic('trash',18,2)}<span>Удалить лида</span></button>`,(sh,close)=>{
    const g=k=>$('#e-'+k,sh).value;let armed=0;
    $('#esave',sh).onclick=async()=>{
      let t=parseHandle(g('tg')),i=parseHandle(g('ig'));
      if(t&&t.kind==='ig'&&!i){i=t;t=null}else if(i&&i.kind==='tg'&&!t){t=i;i=null}
      if(!t&&!i){hnote('error');toast('Нужен хотя бы один ник');return}
      const patch={tg:t?t.name:'',ig:i?i.name:'',name:g('nm').trim()},oldTg=l.tg;
      patchLocal(id,{tg:patch.tg||null,ig:patch.ig||null,name:patch.name||null});close();hnote('success');redrawTop();
      try{await api.update(id,patch)}catch(e){toast('Нет связи, правка не сохранилась');return}
      if(t&&t.name!==oldTg&&(!l.avatar||!patch.name)){api.tgProfile(t.name).then(r=>{const p={};if(r.avatar&&!l.avatar)p.avatar=r.avatar;if(r.name&&!l.name)p.name=r.name;if(p.avatar||p.name){patchLocal(id,p);redrawTop();api.update(id,p).catch(()=>{})}})}
    };
    const del=$('#edel',sh);del.onclick=async()=>{
      if(!armed){armed=1;del.lastChild.textContent='Точно удалить?';del.style.color='#fff';del.style.background='#D92D20';hap('light');setTimeout(()=>{if(del.isConnected){armed=0;del.lastChild.textContent='Удалить лида';del.style.color='';del.style.background=''}},3000);return}
      close();const onLead=topEl()&&topEl().dataset.name==='lead';dropLocal(id);hnote('warning');
      if(onLead){await pop()}else redrawTop();
      try{await api.delLead(id)}catch(e){toast('Нет связи, лид не удалился')}
    };
  });
}
function segAct(t){const seg=t.closest('.seg');segSet(seg,t.dataset.v);hsel()}
let planT=0;
function stepPlan(k,d){
  const me=D.me;let n;if(k==='tempo')n=clamp(me.tempo+d*5,5,100);else n=clamp(me.repeat+d,1,14);
  if(n===me[k]){hnote('warning');return}
  me[k]=n;if(D.queue){D.queue.tempo=me.tempo;D.queue.repeat=me.repeat}D.rowsV=(D.rowsV||0)+1;hap('light');
  const v=$('#v-'+k);v.textContent=n;v.parentElement.animate([{transform:'scale(1.1)'},{transform:'none'}],{duration:380,easing:EASE});
  if(k==='repeat'){const u=$('#u-repeat');u.textContent=plural(n,'день','дня','дней')}
  clearTimeout(planT);planT=setTimeout(()=>api.setPlan(me.tempo,me.repeat).then(()=>silentRefreshQ()).catch(()=>toast('Нет связи, не сохранилось')),450);
}
async function silentRefreshQ(){try{const v=await api.queue();if(!same('q',v)){D.queue=v}}catch(e){}}

const ACT={
  tab:t=>go(t.dataset.v),
  settings:()=>push('settings'),add:()=>push('add'),back:()=>pop(),
  editlead:t=>editLead(t.dataset.id),
  sent:t=>doSent(t.dataset.id,t.dataset.kind),unsent:t=>doUnsent(t.dataset.id),
  open:(t,e)=>{e.stopPropagation();hap('light');D.opened[t.dataset.id]=t.dataset.ch;openCh(t.dataset.ch,t.dataset.u)},
  lead:t=>push('lead',{id:t.dataset.id}),
  filter:t=>{D.filter=t.dataset.v;$$('#chips .chip').forEach(b=>b.classList.toggle('on',b===t));hsel();$('#llist').innerHTML=lList();const l=$('#llist');l.animate([{opacity:.35},{opacity:1}],{duration:200,easing:EASE})},
  quick:(t,e)=>{e.stopPropagation();setLeadStatus(t.dataset.id,'replied',true)},
  period:t=>{D.period=t.dataset.v==='all'?'all':+t.dataset.v;segAct(t);const el=t.closest('.screen'),S=statsCached(D.period);D.S=S;el.classList.remove('still');const b=$('#sbody',el);b.innerHTML=statsBody(S);enhance(b,true)},
  bar:t=>{const S=D.S,s=S.series[+t.dataset.i];$$('.bar').forEach(b=>b.classList.toggle('sel',b===t));hsel();$('#tip').innerHTML=tipHTML(s)},
  kind:t=>{D.kind=t.dataset.v;segAct(t);const el=t.closest('.screen');el._redraw&&el._redraw()},
  setstatus:t=>{const id=t.closest('#sgrid').dataset.id,l=getLead(id);let s=t.dataset.v;if(l&&l.status===s)s='sent';$$('#sgrid .sb').forEach(b=>b.classList.toggle('on',b.dataset.v===s));setLeadStatus(id,s,false)},
  againnow:t=>{const l=getLead(t.dataset.id);if(!l)return;const ch=l[l.channel]?l.channel:(l.tg?'tg':'ig');hnote('success');patchLocal(l.id,{again_at:Date.now(),again_channel:ch});if(D.queue){D.queue.again=D.queue.again.filter(x=>x.id!==l.id);if(!D.queue.done.some(x=>x.id===l.id))D.queue.done.unshift(l)}redrawTop();api.setAgain(l.id,true,ch).catch(()=>toast('Нет связи'))},
  followers:t=>{const l=getLead(t.dataset.id);sheet(`<h3>Подписчики</h3><div class="sub">Можно писать 8200 или 8,2к</div><input class="one" id="fin" inputmode="decimal" placeholder="Например 8,2к" value="${l.followers||''}" autocomplete="off"><button class="btn p" id="fsave">Сохранить</button>`,(sh,close)=>{const i=$('#fin',sh);setTimeout(()=>i.focus(),350);$('#fsave',sh).onclick=async()=>{const n=parseNum(i.value);if(n==null&&i.value.trim()){hnote('error');return}patchLocal(l.id,{followers:n});close();const f=$('#fol');if(f)f.textContent=n?fmtK(n)+' подписчиков':'Указать подписчиков';hnote('success');try{await api.update(l.id,{followers:n==null?'':n})}catch(e){toast('Нет связи')}}})},
  addsocial:t=>{const l=getLead(t.dataset.id),ch=t.dataset.ch;sheet(`<h3>${ch==='tg'?'Telegram':'Instagram'} лида</h3><div class="sub">Ник или ссылка</div><input class="one" id="sin" placeholder="@ник или ссылка" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn p" id="ssave">Добавить</button>`,(sh,close)=>{const i=$('#sin',sh);setTimeout(()=>i.focus(),350);$('#ssave',sh).onclick=async()=>{const p=parseHandle(i.value);if(!p){hnote('error');return}const k=p.kind||ch;patchLocal(l.id,{[k]:p.name});close();hnote('success');try{await api.update(l.id,{[k]:p.name})}catch(e){toast('Нет связи')}redrawTop()}})},
  step:t=>stepPlan(t.dataset.k,+t.dataset.d),
  link:()=>sheet(`<h3>Подключить ноутбук</h3><div class="sub">Открой Touch в Telegram на ноутбуке и введи этот код. Он действует 10 минут и работает один раз.</div><div id="lbox">${codeBoxes('......')}</div><div class="err" id="lerr"></div><button class="btn white p" id="lok">Готово</button>`,(sh,close)=>{
    $('#lok',sh).onclick=close;
    api.linkCreate().then(c=>{$('#lbox',sh).innerHTML=codeBoxes(c);hnote('success')}).catch(()=>{$('#lerr',sh).textContent='Нет связи, попробуй еще раз'})}),
  leave:()=>sheet(`<h3>Выйти из Touch?</h3><div class="sub">Лиды останутся в базе. Чтобы войти снова, понадобится код из Настроек на другом устройстве.</div><div style="height:16px"></div><button class="btn p" id="lyes" style="background:#D92D20">Выйти</button>`,(sh,close)=>{$('#lyes',sh).onclick=async()=>{close();await api.leave();location.reload()}}),
  sjoin:async t=>{const i=$('#codein'),err=$('#serr'),v=i.value.trim().toUpperCase();if(v.length<4){i.classList.remove('bad');void i.offsetWidth;i.classList.add('bad');hnote('error');return}
    t.disabled=true;try{await api.linkUse(v);hnote('success');await enterApp()}catch(e){t.disabled=false;i.classList.remove('bad');void i.offsetWidth;i.classList.add('bad');hnote('error');err.textContent=String(e.message).includes('bad_code')?'Такого кода нет или он устарел':'Нет связи, попробуй еще раз'}},
  sfirst:async t=>{t.disabled=true;try{await api.create(D.tgUser||{id:null,name:'Артем',photo:null});await enterApp()}catch(e){t.disabled=false;$('#serr').textContent=String(e.message).includes('closed')?'Вход закрыт. Возьми код в Настройках на телефоне':'Нет связи, попробуй еще раз'}}
};
app.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const f=ACT[t.dataset.act];if(f){f(t,e)}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'){const t=e.target.closest&&e.target.closest('[data-act][role="button"]');if(t)t.click()}});

/* ============ boot ============ */
function initTG(){
  try{if(TG){TG.ready();TG.expand();TG.setHeaderColor&&TG.setHeaderColor('#F2F2F4');TG.setBackgroundColor&&TG.setBackgroundColor('#F2F2F4');TG.disableVerticalSwipes&&TG.disableVerticalSwipes()}}catch(e){}
  const u=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user;
  D.tgUser=u?{id:u.id,name:u.first_name||u.username||'Артем',photo:u.photo_url||null}:null;
}
async function enterApp(pre){
  if(!pre)await loadAll();drawTabs();
  host.innerHTML='';curEl=null;curTab=null;$$('.screen.pushed').forEach(x=>x.remove());pushed.length=0;
  tabbar.style.display='';await go('home',true);
  const u=D.tgUser;if(u&&(u.name!==D.me.name||(u.photo&&u.photo!==D.me.photo)))api.profile(u.name,u.photo).catch(()=>{});
}
function showSetup(){tabbar.style.display='none';host.innerHTML='';const el=document.createElement('div');el.className='screen';el.style.paddingBottom='28px';mount(el,'setup',{},true);host.appendChild(el);curEl=el;curTab='setup';const i=$('#codein',el);i&&i.addEventListener('keydown',e=>{if(e.key==='Enter')$('[data-act="sjoin"]',el).click()})}
async function boot(){
  initTG();const t0=performance.now();
  if(DEMO){dinit(/[?&]fresh/.test(location.search));if(!/[?&]setup/.test(location.search)){TOKEN='demo';localStorage.setItem('touch_token','demo')}else{TOKEN='';localStorage.removeItem('touch_token')}}
  let ok=false;
  try{if(TOKEN){await loadAll();ok=true}}catch(e){if(/auth/.test(String(e.message))){localStorage.removeItem('touch_token');TOKEN=''}}
  await sleep(Math.max(0,1400-(performance.now()-t0)));
  if(ok)await enterApp(true);else showSetup();
  const s=$('#splash');s.classList.add('out');setTimeout(()=>s.remove(),700);
}
boot();


</script>
